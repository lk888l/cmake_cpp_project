# Production defaults for Luckfox Pico RV1103 + SC3336 + 240x240 ST7789.
[camera]
id = 0
width = 640
height = 360
target_fps = 30
minimum_fps = 25
buffer_count = 2
frame_timeout_ms = 500
iq_directory = /oem/usr/share/iqfiles
entity_name = rkisp_mainpath

[display]
spi_device = /dev/spidev0.0
spi_hz = 40000000
spi_chunk_bytes = 4096
gpio_chip = /dev/gpiochip1
dc_line = 20
reset_line = 22
backlight_line = 21
width = 240
height = 240
x_offset = 0
y_offset = 0
rotation = 0
bgr = true
invert_colors = true

[render]
aspect = letterbox
osd_enabled = true
osd_period_ms = 1000

[runtime]
maximum_restarts = 3
shutdown_timeout_s = 3
stats_period_ms = 1000
